[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-wrangler"
dynamic = ["version"]
description = "Manage isolated project-local OpenAI Codex CLI installs."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
  {name = "M. Heck"}
]
keywords = ["codex", "openai", "cli", "tooling", "operations"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Operating System :: POSIX :: Linux",
  "Topic :: Software Development :: Build Tools",
  "Topic :: Utilities",
]
dependencies = []

[project.urls]
Repository = "https://github.com/Hard-Problems-Group-LLC/codex-wrangler"
Issues = "https://github.com/Hard-Problems-Group-LLC/codex-wrangler/issues"

[project.optional-dependencies]
dev = [
  "black==25.1.0",
  "ruff==0.15.7",
  "pytest==8.4.2",
  "pytest-timeout==2.4.0",
]

[project.scripts]
codex-wrangler = "codex_wrangler.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
license-files = ["LICENSE"]

[tool.setuptools.dynamic]
version = {attr = "codex_wrangler.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
